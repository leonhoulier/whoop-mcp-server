name: whoop-mcp
services:
  whoop-mcp:
    image: whoop-mcp:${WHOOP_RELEASE:?Set the release tag}
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8003:8003"]
    volumes: ["/var/lib/whoop-mcp:/data"]
    networks: [whoop]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
networks:
  whoop:
    external: true
    name: together-whoop
