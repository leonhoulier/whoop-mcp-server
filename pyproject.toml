[project]
name = "whoop-mcp-server"
version = "0.2.0"
description = "Authenticated WHOOP MCP with separate accounts"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "cryptography==50.0.2", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
whoop-mcp-server = "shared_server:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["shared_server", "shared_whoop"]
package-dir = {"" = "src"}
